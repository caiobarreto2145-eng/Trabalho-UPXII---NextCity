# Conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecopontos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA: só CONFERE se as classes Java batem com as tabelas do banco.
# Nunca cria, altera ou apaga nada sozinho — as tabelas são controladas por você via SQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Porta do servidor
server.port=8080