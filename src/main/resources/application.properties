# EcoPontos - configuração. Nenhuma senha fica aqui: ela vem de variáveis de ambiente (nuvem)
# ou do arquivo application-local.properties (no seu computador, fora do GitHub).
spring.application.name=ecopontos-api
server.port=${PORT:8080}

# Se existir, este arquivo (na raiz do projeto) sobrescreve os valores abaixo no seu computador
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecopontos_db?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Upload das fotos de comprovação
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=${UPLOAD_DIR:uploads}

# Chave do token JWT (na nuvem, defina JWT_SECRET com 32 caracteres ou mais)
app.jwt-secret=${JWT_SECRET:ecopontos-chave-secreta-super-segura-com-pelo-menos-32-bytes}
