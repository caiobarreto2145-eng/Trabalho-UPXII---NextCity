<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoPontos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-top">
    <span class="brand">🌿 EcoPontos</span>
    <div class="top-right">
      <span class="top-points"><span id="top-points">0</span> pts</span>
      <button type="button" class="btn ghost" onclick="logout()">Sair</button>
    </div>
  </header>

  <nav class="nav" id="nav">
    <button type="button" data-view="home" class="active">🏠 Início</button>
    <button type="button" data-view="actions">♻️ Ações</button>
    <button type="button" data-view="rewards">🎁 Recompensas</button>
    <button type="button" data-view="ranking">🏆 Ranking</button>
    <button type="button" data-view="vouchers">🎟️ Vouchers</button>
    <button type="button" data-view="history">🕘 Histórico</button>
    <button type="button" data-view="validate" id="nav-validate" class="hidden">🏪 Validar</button>
    <button type="button" data-view="approvals" id="nav-approvals" class="hidden">🛡️ Aprovações</button>
  </nav>

  <main class="app-main">
    <section id="view-home" class="view"></section>
    <section id="view-actions" class="view hidden"></section>
    <section id="view-rewards" class="view hidden"></section>
    <section id="view-ranking" class="view hidden"></section>
    <section id="view-vouchers" class="view hidden"></section>
    <section id="view-history" class="view hidden"></section>
    <section id="view-validate" class="view hidden"></section>
    <section id="view-approvals" class="view hidden"></section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
