<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EcoPontos — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c8 0 14-6 14-14V4h-2C9 4 5 10 5 18v2Z"/><path d="M5 20c2-6 5-9 10-12"/></svg>
    </div>
    <h1>EcoPontos</h1>
    <p class="sub">Transforme ações sustentáveis em recompensas</p>

    <div class="tabs">
      <button type="button" class="tab active" id="tab-login">Entrar</button>
      <button type="button" class="tab" id="tab-register">Criar conta</button>
    </div>

    <div id="msg" class="msg" role="alert"></div>

    <form id="form-login">
      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" autocomplete="email" required placeholder="voce@email.com">
      <label for="login-password">Senha</label>
      <input id="login-password" type="password" autocomplete="current-password" required placeholder="Sua senha">
      <button type="submit" class="btn">Entrar</button>
    </form>

    <form id="form-register" class="hidden">
      <label for="reg-name">Nome</label>
      <input id="reg-name" type="text" autocomplete="name" required placeholder="Seu nome">
      <label for="reg-email">E-mail</label>
      <input id="reg-email" type="email" autocomplete="email" required placeholder="voce@email.com">
      <label for="reg-password">Senha</label>
      <input id="reg-password" type="password" autocomplete="new-password" required placeholder="Crie uma senha">
      <label for="reg-password2">Confirmar senha</label>
      <input id="reg-password2" type="password" autocomplete="new-password" required placeholder="Repita a senha">
      <button type="submit" class="btn">Criar conta</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
